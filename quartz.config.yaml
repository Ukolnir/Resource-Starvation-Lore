# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Магнатрон
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: ru-RU
  baseUrl: ukolnir.github.io/Resource-Starvation-Lore
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - _Мастерское
    - Мастерское
    - _Шаблоны
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Exo 2
      body: Exo 2
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#0a0e16"
        lightgray: "#1f2a36"
        gray: "#6e7c8c"
        darkgray: "#c8d0e0"
        dark: "#e8edf3"
        secondary: "#5fc4d4"
        tertiary: "#d97548"
        highlight: rgba(95, 196, 212, 0.08)
        textHighlight: "#e8b84a88"
      darkMode:
        light: "#0a0e16"
        lightgray: "#1f2a36"
        gray: "#6e7c8c"
        darkgray: "#c8d0e0"
        dark: "#e8edf3"
        secondary: "#5fc4d4"
        tertiary: "#d97548"
        highlight: rgba(95, 196, 212, 0.08)
        textHighlight: "#e8b84a88"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      # Обе схемы тёмные: атрибут saved-theme ставит плагин darkmode, а он
      # выключен, поэтому без этого применялась бы светлая тема кода.
      theme:
        light: tokyo-night
        dark: tokyo-night
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      useThemeFonts: false
      fontOrigin: googleFonts
      # Тело статей — Exo 2, интерфейс и мелкие лейблы — JetBrains Mono.
      body:
        name: Exo 2
        weights: [400, 600, 700]
        includeItalic: true
      header:
        name: Exo 2
        weights: [600, 700]
      # h3-h6 работают как терминальные подписи капсом, поэтому моноширинные
      h3:
        name: JetBrains Mono
        weights: [500, 700]
      h4:
        name: JetBrains Mono
        weights: [500, 700]
      h5:
        name: JetBrains Mono
        weights: [500, 700]
      h6:
        name: JetBrains Mono
        weights: [500, 700]
      title:
        name: JetBrains Mono
        weights: [500, 700]
      code:
        name: JetBrains Mono
        weights: [400, 500, 700]
      interface:
        name: JetBrains Mono
        weights: [400, 500, 600]
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  # Плагин пишет в public/CNAME хост из baseUrl. Для проектной страницы это
  # был бы "ukolnir.github.io" — GitHub принял бы его за кастомный домен и
  # сайт сломался бы. Включать только под собственный домен.
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: false
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    options:
      rootName: Магнатрон
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      # Здесь были ссылки на репозиторий и Discord самого Quartz — на нашем
      # сайте они читались бы как наши. Свои ссылки добавляй сюда же.
      links: {}
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:Requiae/quartz-leaflet-bases-plugin
    enabled: true
    options:
      enableCopyTool: false
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
